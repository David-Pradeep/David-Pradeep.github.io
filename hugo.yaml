# Override at build time with the HUGO_BASEURL env var (e.g. when moving to another host).
baseURL: "https://david-pradeep.github.io/"
title: "David Pradeep"
languageCode: en-us
theme: PaperMod

pagerSize: 8
enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: false

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home: [HTML, RSS, JSON] # JSON powers the search page

taxonomies:
  tag: tags
  category: categories

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false # theme CSS styles the code blocks, so light/dark mode works

params:
  env: production
  title: "David Pradeep"
  description: "Notes on mobile technology, self-hosted DevOps and AI."
  author: "David Pradeep"
  defaultTheme: auto # follows the system; visitors can toggle
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true

  # Privacy-friendly analytics, disabled until a code is set.
  # Create a free site at goatcounter.com and put its code here (e.g. "david-pradeep").
  analytics:
    goatcounter: ""

  assets:
    favicon: "favicon.svg"
    disableHLJS: true

  homeInfoParams:
    Title: "Hi, I'm David 👋"
    Content: >
      I write about **mobile technology**, **self-hosted DevOps** and **AI**:
      practical notes, how-tos and lessons learned.

  socialIcons:
    - name: github
      url: "https://github.com/David-Pradeep"
    - name: rss
      url: "index.xml"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 40
    - identifier: search
      name: Search
      url: /search/
      weight: 50
    - identifier: about
      name: About
      url: /about/
      weight: 60
